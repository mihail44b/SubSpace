name: subspace-prod

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: ${POSTGRES_DB:?Required}
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${APP_IMAGE:?Required}
    restart: unless-stopped
    mem_limit: 160m
    memswap_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Required}
    ports:
      - "127.0.0.1:8000:8000"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
